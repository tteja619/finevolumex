name: Build FineVolumeX

on:
  workflow_dispatch:
  push:
    branches:
      - fix/persistent-per-app-volume

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$RUNNER_TEMP"
          curl -fLo commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          mkdir -p android-tools
          unzip -q commandlinetools.zip -d android-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -r android-tools/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FineVolumeX-debug
          path: app/build/outputs/apk/debug/app-debug.apk
